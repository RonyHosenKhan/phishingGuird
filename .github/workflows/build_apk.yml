name: Build PhishGuard AI Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK with Gradle
        working-directory: android_native
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PhishGuardAI-Debug-APK
          path: android_native/app/build/outputs/apk/debug/app-debug.apk

      - name: Release Latest APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: latest
          name: "PhishGuard AI v1.2 (Live Threat Interceptor)"
          body: |
            ### 🛡️ PhishGuard AI - Latest Updated APK
            - Intercepts WhatsApp, SMS, Messenger & Gmail phishing in real-time.
            - On-Device Machine Learning (Random Forest + Deep Autoencoder).
            - Service Re-Bind button for Android 13/14 permissions.
          files: |
            android_native/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
